<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AisleVision — List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="app-body">

<header class="app-header">
  <div class="app-header-inner">
    <span class="app-brand">AisleVision</span>
  </div>
</header>

<main class="app-main">
  <div class="app-card">
    <div class="app-card-head">
      <div>
        <h1 class="app-title">Grocery list</h1>
        <p class="app-subtitle" id="itemCount">0 items</p>
      </div>
    </div>

    <div class="quick-pick-row">
      <label class="visually-hidden" for="commonItemSelect">Pick an item</label>
      <select id="commonItemSelect" class="common-item-select" title="Pick an item to fill the box below">
        <option value="">Pick an item…</option>
        <option value="Cup">Cup</option>
        <option value="Bottle">Bottle</option>
        <option value="Microwave">Microwave</option>
        <option value="Potted plant">Potted plant</option>
        <option value="Keyboard">Keyboard</option>
        <option value="Person">Person</option>
        <option value="Bicycle">Bicycle</option>
        <option value="Car">Car</option>
        <option value="Motorcycle">Motorcycle</option>
        <option value="Airplane">Airplane</option>
        <option value="Bus">Bus</option>
        <option value="Train">Train</option>
        <option value="Truck">Truck</option>
        <option value="Boat">Boat</option>
        <option value="Traffic light">Traffic light</option>
        <option value="Fire hydrant">Fire hydrant</option>
        <option value="Stop sign">Stop sign</option>
        <option value="Parking meter">Parking meter</option>
        <option value="Bench">Bench</option>
        <option value="Bird">Bird</option>
        <option value="Cat">Cat</option>
        <option value="Dog">Dog</option>
        <option value="Horse">Horse</option>
        <option value="Sheep">Sheep</option>
        <option value="Cow">Cow</option>
        <option value="Elephant">Elephant</option>
        <option value="Bear">Bear</option>
        <option value="Zebra">Zebra</option>
        <option value="Giraffe">Giraffe</option>
        <option value="Backpack">Backpack</option>
        <option value="Umbrella">Umbrella</option>
        <option value="Handbag">Handbag</option>
        <option value="Tie">Tie</option>
        <option value="Suitcase">Suitcase</option>
        <option value="Frisbee">Frisbee</option>
        <option value="Skis">Skis</option>
        <option value="Snowboard">Snowboard</option>
        <option value="Sports ball">Sports ball</option>
        <option value="Kite">Kite</option>
        <option value="Baseball bat">Baseball bat</option>
        <option value="Baseball glove">Baseball glove</option>
        <option value="Skateboard">Skateboard</option>
        <option value="Surfboard">Surfboard</option>
        <option value="Tennis racket">Tennis racket</option>
        <option value="Wine glass">Wine glass</option>
        <option value="Fork">Fork</option>
        <option value="Knife">Knife</option>
        <option value="Spoon">Spoon</option>
        <option value="Bowl">Bowl</option>
        <option value="Banana">Banana</option>
        <option value="Apple">Apple</option>
        <option value="Sandwich">Sandwich</option>
        <option value="Orange">Orange</option>
        <option value="Broccoli">Broccoli</option>
        <option value="Carrot">Carrot</option>
        <option value="Hot dog">Hot dog</option>
        <option value="Pizza">Pizza</option>
        <option value="Donut">Donut</option>
        <option value="Cake">Cake</option>
        <option value="Chair">Chair</option>
        <option value="Couch">Couch</option>
        <option value="Bed">Bed</option>
        <option value="Dining table">Dining table</option>
        <option value="Toilet">Toilet</option>
        <option value="Tv">Tv</option>
        <option value="Laptop">Laptop</option>
        <option value="Mouse">Mouse</option>
        <option value="Remote">Remote</option>
        <option value="Cell phone">Cell phone</option>
        <option value="Oven">Oven</option>
        <option value="Toaster">Toaster</option>
        <option value="Sink">Sink</option>
        <option value="Refrigerator">Refrigerator</option>
        <option value="Book">Book</option>
        <option value="Clock">Clock</option>
        <option value="Vase">Vase</option>
        <option value="Scissors">Scissors</option>
        <option value="Teddy bear">Teddy bear</option>
        <option value="Hair drier">Hair drier</option>
        <option value="Toothbrush">Toothbrush</option>
      </select>
    </div>

    <div class="add-row">
      <input type="text" id="itemInput" class="item-input" placeholder="Add an item (e.g. Banana)" autocomplete="off" />
      <button type="button" class="btn-primary" id="addBtn">Add</button>
    </div>

    <ul class="shopping-list" id="shoppingList"></ul>

    <div class="app-actions">
      <button type="button" class="btn-secondary" id="clearPickedBtn">Remove picked up</button>
      <button type="button" class="btn-secondary btn-strong" id="refreshBtn">Refresh from server</button>
    </div>
  </div>
</main>

<script src="js/app.js"></script>
</body>
</html>
