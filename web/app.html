<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AisleVision — List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="app-body">

<header class="app-header">
  <div class="app-header-inner">
    <a href="index.html" class="app-brand">AisleVision</a>
  </div>
</header>

<main class="app-main">
  <div class="app-card">
    <div class="app-card-head">
      <div>
        <h1 class="app-title">Grocery list</h1>
        <p class="app-subtitle" id="itemCount">0 items</p>
      </div>
    </div>

    <div class="add-row">
      <input type="text" id="itemInput" class="item-input" placeholder="Add an item (e.g. Milk)" autocomplete="off" />
      <button type="button" class="btn-primary" id="addBtn">Add</button>
    </div>

    <ul class="shopping-list" id="shoppingList"></ul>

    <div class="app-actions">
      <button type="button" class="btn-secondary" id="clearPickedBtn">Remove picked up</button>
      <button type="button" class="btn-secondary btn-strong" id="refreshBtn">Refresh from server</button>
    </div>

    <p class="app-hint">Run <code>npm run dev</code> in the <code>server</code> folder, then open this page at <code>http://localhost:3000/app.html</code> to use the database.</p>
  </div>
</main>

<script src="js/app.js"></script>
</body>
</html>
